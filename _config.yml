# Site settings
title: Portfolio
description: Portfolio - Simone Del Grosso
baseurl: ""
url: "https://simonedelgrosso.github.io"

# Build settings
markdown: kramdown
timezone: Europe/Rome

# Planning notes and developer tooling must never be published as part of the site.
exclude:
  - plans
  - tools
  - AGENTS.md

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: "en"
    values:
      lang: "en"
  - scope:
      path: "it"
    values:
      lang: "it"
