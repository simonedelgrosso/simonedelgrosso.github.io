it:
  title: "Chi sono"
  subtitle: "Software, tecnologia e sperimentazione"
  text_1: Sono un <strong class="text-accent">Full-Stack Developer</strong> con sede a Roma. Lavoro nello sviluppo di applicazioni web e soluzioni backend, principalmente con <strong class="text-accent">C#</strong>, <strong class="text-accent">.NET</strong> e <strong class="text-accent">Microsoft Azure</strong>.
  text_2: Ho conseguito una laurea in <strong class="text-accent">Scienze e Tecnologie Informatiche</strong> presso l'Università di Roma Tor Vergata e, dal 2023, lavoro in Cluster Reply, dove contribuisco allo sviluppo di soluzioni software per contesti enterprise.
  text_3: Oltre all'attività professionale, mi piace approfondire tecnologie e ambiti diversi, dal <strong class="text-accent">cloud computing</strong> all'<strong class="text-accent">intelligenza artificiale</strong>, fino allo sviluppo di applicazsioni mobile e alla programmazione di sistemi embedded. Attraverso i miei progetti personali sperimento nuovi strumenti, approfondisco ciò che studio e metto in pratica le mie idee.
  location: "Roma, Italia"
en:
  title: "About Me"
  subtitle: "Software, technology, and experimentation"
  text_1: I am a <strong class="text-accent">Full-Stack Developer</strong> based in Rome. I work on the development of web applications and backend solutions, primarily using <strong class="text-accent">C#</strong>, <strong class="text-accent">.NET</strong>, and <strong class="text-accent">Microsoft Azure</strong>.
  text_2: I hold a degree in <strong class="text-accent">Computer Science</strong> from the University of Rome Tor Vergata. Since 2023, I have been working at Cluster Reply, where I contribute to the development of software solutions for enterprise environments.
  text_3: Beyond my professional work, I enjoy exploring various technologies and fields, ranging from <strong class="text-accent">cloud computing</strong> and <strong class="text-accent">artificial intelligence</strong> to mobile application development and embedded systems programming. Through my personal projects, I experiment with new tools, delve deeper into what I study, and put my ideas into practice.
  location: "Rome, Italy"